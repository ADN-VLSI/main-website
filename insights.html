<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADN Semiconductors | Insights</title>
  <meta
    name="description"
    content="Read ADN Semiconductors announcements, insights, and updates from our engineering and operations teams."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  >
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/styles.css?v=12">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <site-header></site-header>

  <main id="main-content">
    <section class="section reveal" aria-labelledby="insights-title">
      <div class="container">
        <div class="section-head">
          <div>
            <p class="eyebrow">Insights</p>
            <h1 id="insights-title">Latest Updates from ADN Semiconductors</h1>
          </div>
          <a class="btn btn-secondary" href="contact.html">Talk to Our Team</a>

        <div class="listing-search" role="search" aria-label="Search insights">
          <label class="listing-search-label" for="insights-search">Search Insights</label>
          <input
            id="insights-search"
            name="insights-search"
            type="search"
            placeholder="Search by title, author, topic, or summary"
            autocomplete="off"
          >
          <p class="listing-search-status" id="insights-search-status" aria-live="polite"></p>
        </div>
        <div class="card-grid" id="insights-list" role="list" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <site-footer></site-footer>
  <script type="module" src="js/layout.js?v=17"></script>
  <script type="module" src="js/main.js?v=13"></script>
