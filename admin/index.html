<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADN Content Maintenance | Local Tools</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="admin-header">
    <div class="container">
      <h1>ADN Content Maintenance Tools</h1>
      <p>Local-only editor for Insights and Careers JSON content.</p>
      <p>
        Public website: <a href="../index.html">Back to ADN Semiconductors site</a>
      </p>
    </div>
  </header>

  <main class="container admin-main">
    <section class="panel" aria-labelledby="insights-panel-title">
      <div class="panel-head">
        <h2 id="insights-panel-title">Insights</h2>
        <div class="button-row">
          <button type="button" id="add-insight">Add Insight</button>
          <button type="button" id="export-insights">Export insights.json</button>
          <label class="file-input-label" for="import-insights">Import JSON</label>
          <input id="import-insights" type="file" accept="application/json" hidden>
        </div>
      </div>
      <div id="insights-editor" class="editor-list"></div>
    </section>

    <section class="panel" aria-labelledby="roles-panel-title">
      <div class="panel-head">
        <h2 id="roles-panel-title">Careers</h2>
        <div class="button-row">
          <button type="button" id="add-role">Add Role</button>
          <button type="button" id="export-roles">Export careers.json</button>
          <label class="file-input-label" for="import-roles">Import JSON</label>
          <input id="import-roles" type="file" accept="application/json" hidden>
        </div>
      </div>
      <div id="roles-editor" class="editor-list"></div>
    </section>

    <section class="panel" aria-labelledby="combined-export-title">
      <div class="panel-head">
        <h2 id="combined-export-title">Project Data Snapshot</h2>
      </div>
      <p>
        Download a single snapshot that contains both datasets for review or archival.
      </p>
      <div class="button-row">
        <button type="button" id="export-all">Export combined-content.json</button>
      </div>
    </section>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

  <template id="insight-template">
    <article class="editor-card">
      <div class="editor-grid">
        <label>Type
          <input data-field="type" type="text" required>
        </label>
        <label>Date
          <input data-field="date" type="date">
        </label>
        <label>Author
          <input data-field="author" type="text">
        </label>
        <label>Link URL
          <input data-field="url" type="text">
        </label>
        <label class="full">Title
          <input data-field="title" type="text" required>
        </label>
        <label class="full">Summary
          <textarea data-field="summary" rows="3"></textarea>
        </label>
      </div>
      <div class="card-actions">
        <button type="button" data-action="remove">Remove</button>
      </div>
    </article>
  </template>

  <template id="role-template">
    <article class="editor-card">
      <div class="editor-grid">
        <label>Title
          <input data-field="title" type="text" required>
        </label>
        <label>Team
          <input data-field="team" type="text">
        </label>
        <label>Location
          <input data-field="location" type="text">
        </label>
        <label>Type
          <input data-field="type" type="text">
        </label>
        <label class="full">Apply URL
          <input data-field="applyUrl" type="text">
        </label>
        <label class="full">Summary
          <textarea data-field="summary" rows="3"></textarea>
        </label>
        <label class="full">Requirements (one per line)
          <textarea data-field="requirements" rows="4"></textarea>
        </label>
      </div>
      <div class="card-actions">
        <button type="button" data-action="remove">Remove</button>
      </div>
    </article>
  </template>

  <script type="module" src="admin.js"></script>
</body>
</html>
